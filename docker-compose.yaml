services:
  postgresql:
    image: 'postgis/postgis:16-3.4-alpine'
    command: postgres -c 'max_connections=200'
    restart: always
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'
    environment:
      # Using credentials from existing database volume
      POSTGRES_USER: bbdf554
      POSTGRES_PASSWORD: Idk@2026lolhappyha232
      POSTGRES_DB: directus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: 'redis:7-alpine'
    command: 'redis-server --appendonly yes'
    restart: always
    volumes:
      - 'redis-data:/data'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  directus:
    image: 'directus/directus:11'
    restart: always
    volumes:
      - 'directus-uploads:/directus/uploads'
      - 'directus-extensions:/directus/extensions'
    environment:
      KEY: 9i2t1bMAIITWCZ+WrzUEk4EuNmIu3kfyB9Peysk7f/jnUZ7hzQ5HoNC8yOT5vi/rwTmDWX3a1+4j2llgAE2VvA==
      SECRET: Mr4YSrOAfwToxCDFOPwUa8qtxd7BXOvmqXalk3ReikpfcIwf08Kp+hlNjGcr1NtcLIcIZoraaULnMefD5IukGA==
      ADMIN_EMAIL: somescreenname@gmail.com
      ADMIN_PASSWORD: Idk@2026lolhappyha232
      DB_CLIENT: postgres
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE: directus
      # Match existing database credentials
      DB_USER: bbdf554
      DB_PASSWORD: Idk@2026lolhappyha232
      
      MAX_PAYLOAD_SIZE: '500mb'
      RATE_LIMITER_ENABLED: 'false'
      CORS_ORIGIN: 'https://launch.jumpstartscaling.com,http://localhost:4321'
      CORS_ENABLED: 'true'
      PUBLIC_URL: 'https://spark.jumpstartscaling.com'
      
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "--no-verbose", "http://127.0.0.1:8055/server/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s
    labels:
      coolify.managed: 'true'
      coolify.name: 'directus'
      coolify.fqdn: 'spark.jumpstartscaling.com'
      coolify.port: '8055'

  frontend:
    build:
      context: https://gitthis.jumpstartscaling.com/gatekeeper/net.git#main:frontend
      dockerfile: Dockerfile
    restart: always
    environment:
      PUBLIC_DIRECTUS_URL: 'https://spark.jumpstartscaling.com'
      DIRECTUS_ADMIN_TOKEN: ''
      PUBLIC_PLATFORM_DOMAIN: 'launch.jumpstartscaling.com'
    depends_on:
      - directus
    labels:
      coolify.managed: 'true'
      coolify.name: 'frontend'
      coolify.fqdn: 'launch.jumpstartscaling.com'
      coolify.port: '4321'

volumes:
  postgres-data:
  redis-data:
  directus-uploads:
  directus-extensions:
